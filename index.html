<!DOCTYPE html>
<html>

<head>
  <title>YUME</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="banner">
    <div class="container">

      <h1 class="page-title">YUME EXPERIENCE</h1>
      <h2>Experience Japan through the senses</h2>

      <a href="#apply-section" class="btn-blue shout-button">Discover now</a>

    </div>
  </div>


  <div class="container">

    <h2>YUME JOURNEY</h2>

    <div class="cards">

      <div class="card">
        <img src="images/tea-ceremony.jpeg" alt="Tea Ceremony">
        <h3>Tea Ceremony</h3>
        <a href="#apply-section" class="btn-blue">Book the experience</a>
      </div>

      <div class="card">
        <img src="images/matcha-experience.png" alt="Matcha Experience">
        <h3>Matcha Experience</h3>
        <a href="#apply-section" class="btn-blue">Book the experience</a>
      </div>

      <div class="card">
        <img src="images/gastronomic-experience.png" alt="Gastronomic Experience">
        <h3>Gastronomic Experience</h3>
        <a href="#apply-section" class="btn-blue">Book the experience</a>
      </div>

    </div>


    <p>
      Your booking code:
      <span class="booking-code">YUME25</span>
    </p>

    <button class="copy-code">Copy booking code</button>


    <div id="apply-section">

      <div data-tf-live="01M3WDW51Q8X2FP2RD553K0G8A"></div>
      <script src="https://embed.typeform.com/next/embed.js"></script>

    </div>

  </div>


  <script src="behavior.js"></script>

</body>

</html>
